# MLP learning the three-term staircase f*(z) = z_1 + z_1 z_2 + z_1 z_2 z_3 with the shifted tanh activation.
# Used by Figure 3 (right).
data:
  d: 3
  batch_size: 10000
  powerlaw_alpha: 6.0
  data_seed: 0
  target_hermite: true
  target: "x_{0} + x_{0} x_{1} + x_{0} x_{1} x_{2}"
optimizer:
  learning_rate: 0.03
  convergence_threshold: 1.0e-6
  max_epochs: -1
  ode_step_size: 0.2
  ode_convergence_threshold: 1.0e-6
  ode_max_steps: 100000000
model:
  model_class: mlp
  a_0: 0.57735
  width: 8192
  init_seeds: [0]
  sigma_frozen: 0.1
  activation: shifted_tanh
evaluate:
  a_elements_plot: [[0, 0], [1, 1], [2, 2]]
  smoothing_factor: 0.95
